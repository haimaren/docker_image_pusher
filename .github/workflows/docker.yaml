name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  mirror:
    name: Mirror
    runs-on: ubuntu-latest
    # 只用 skopeo 直转（不经过 docker daemon）：
    # 一次只落一个 blob 到临时盘，峰值占用 ≈ 最大单层，而不是整镜像解压后的体积。
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq skopeo

    - name: Show disk
      run: |
        echo "=============================================================================="
        df -hT / /mnt 2>/dev/null || df -hT /
        echo "=============================================================================="

    - name: Mirror images to Aliyun
      run: |
        set -uo pipefail
        # 临时目录放 /mnt（runner 上是大盘；/mnt 属 root，需要 sudo 建目录）
        TMPDIR_BASE=/mnt/skopeo-tmp
        if ! ( mkdir -p "$TMPDIR_BASE" && [ -w "$TMPDIR_BASE" ] ) 2>/dev/null; then
          sudo mkdir -p "$TMPDIR_BASE"
          sudo chown "$(id -u):$(id -g)" "$TMPDIR_BASE"
        fi
        if [ -w "$TMPDIR_BASE" ]; then
          export TMPDIR="$TMPDIR_BASE"
        else
          export TMPDIR="${RUNNER_TEMP:-/tmp}/skopeo-tmp"
          mkdir -p "$TMPDIR"
        fi
        echo "TMPDIR=$TMPDIR"; df -h "$TMPDIR" || true

        echo "$ALIYUN_REGISTRY_PASSWORD" | skopeo login \
          --username "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                 if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]="$name_space"
            fi
        done < images.txt

        rc=0
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi

            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            if [ -z "$platform" ]; then
                platform_prefix=""
                # 与原 docker pull 行为一致：只转 runner 本机架构（amd64）。
                # 不用 --all：ACR 会拒收 buildx 生成的 attestation manifest
                # (application/vnd.oci.empty.v1+json)，单架构最稳且体积最小。
                arch_args="--override-os linux --override-arch amd64"
            else
                platform_prefix="${platform//\//_}_"
                arch_args="--override-os ${platform%%/*} --override-arch ${platform##*/}"
            fi

            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
               if [[ -n "$name_space" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            # 目标 tag 已存在就跳过，避免重复拉几个 GB
            if skopeo inspect --retry-times 2 "docker://$new_image" >/dev/null 2>&1; then
               echo "== 已存在，跳过: $new_image"
               continue
            fi

            echo "== skopeo copy $image -> $new_image  ($arch_args)"
            if ! skopeo copy --retry-times 3 $arch_args "docker://$image" "docker://$new_image"; then
               echo "!! 转存失败: $image"
               rc=1
               continue
            fi

            echo "== 完成: $new_image"
            rm -rf "${TMPDIR:?}"/*
            df -hT /mnt 2>/dev/null || df -hT /
        done < images.txt

        exit $rc
